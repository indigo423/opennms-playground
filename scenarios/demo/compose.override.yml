---
services:

  kafka:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.3

  kafka-ui:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.6

  elasticsearch:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.4
    volumes:
      - ./container-fs/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    ports:
      - "9200:9200/tcp"
      - "9300:9300/tcp"

  kibana:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.5
    ports:
      - "5601:5601/tcp"

  database:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.10

  core:
    depends_on:
      kafka:
        condition: service_started
    environment:
      PROM_JMX_EXPORTER_ENABLED: true
    volumes:
      - ./container-fs/core-etc-overlay:/opt/opennms-etc-overlay
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.11
    ports:
      - "8980:8980/tcp"
  
  sentinel:
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./container-fs/sentinel-etc-overlay:/opt/sentinel-etc-overlay
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.13
    ports:
      - "8301:8301/tcp"

  grafana:
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.14
    environment:
      GF_INSTALL_PLUGINS: opennms-opennms-app,grafana-piechart-panel,neocat-cal-heatmap-panel,briangann-datatable-panel
    volumes:
       - ./container-fs/grafana:/etc/grafana/provisioning/
    ports:
      - "3000:3000/tcp"

  minion:
    healthcheck:
      start_period: 180s
    volumes:
      - ./container-fs/minion-etc-overlay:/opt/minion-etc-overlay
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.12
      net.fulda:
        ipv4_address: 172.31.0.12
    ports:
      - "8201:8201/tcp"
      - "9999:9999/udp"

  srv-stuttgart-01:
    image: quay.io/labmonkeys/net-snmp:5.9.4-r0.20240919.b3342
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.32

  srv-stuttgart-02:
    image: quay.io/labmonkeys/net-snmp:5.9.4-r0.20240919.b3342
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.33

  web-stuttgart-01:
    image: httpd
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.34

  srv-fulda-01:
    image: quay.io/labmonkeys/net-snmp:5.9.4-r0.20240919.b3342
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.fulda:
        ipv4_address: 172.31.0.32

  srv-fulda-02:
    image: quay.io/labmonkeys/net-snmp:5.9.4-r0.20240919.b3342
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.fulda:
        ipv4_address: 172.31.0.33

  web-fulda-01:
    image: httpd
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64m
    networks:
      net.fulda:
        ipv4_address: 172.31.0.34

  minion-berlin:
    extends:
      file: ../../include/onms-hzn-minion.yml
      service: minion
    healthcheck:
      start_period: 180s
    volumes:
      - ./container-fs/minion-berlin-etc-overlay:/opt/minion-etc-overlay
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.15
      net.berlin:
        ipv4_address: 172.32.0.12

  # nl6 devices live inside the nl6 container, route to them via its address
  minion-berlin-route:
    image: busybox
    network_mode: service:minion-berlin
    cap_add:
      - NET_ADMIN
    command: ["ip", "route", "replace", "10.42.0.0/16", "via", "172.32.0.20"]
    depends_on:
      minion-berlin:
        condition: service_started

  nl6-berlin:
    image: ghcr.io/labmonkeys-space/nl6:v0.34.0
    # SYS_ADMIN lets nl6 create its nl6sim namespace, so traps and flows
    # leave with the device IP as source address
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    devices:
      - /dev/net/tun
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256m
    networks:
      net.berlin:
        ipv4_address: 172.32.0.20
    ports:
      - "8080:8080/tcp"

  # One-shot: create the nl6 fabric, provision the inventory, upload the topology
  init:
    build:
      context: ./init
      dockerfile_inline: |
        FROM ghcr.io/no42-org/onmsctl:0.5.0 AS onmsctl
        FROM curlimages/curl:8.16.0
        COPY --from=onmsctl /usr/local/bin/onmsctl /usr/local/bin/onmsctl
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      ONMSCTL_CONFIG: /init/onmsctl/config.yaml
      ONMS_PASSWORD: admin
    volumes:
      - ./init:/init:ro
    networks:
      net.stuttgart:
        ipv4_address: 172.30.0.16
      net.berlin:
        ipv4_address: 172.32.0.21
    depends_on:
      core:
        condition: service_healthy
      minion:
        condition: service_healthy
      minion-berlin:
        condition: service_healthy
      nl6-berlin:
        condition: service_started

networks:
  net.stuttgart:
      driver: bridge
      ipam:
        config:
          - subnet: 172.30.0.0/16
  net.fulda:
      driver: bridge
      ipam:
        config:
          - subnet: 172.31.0.0/16
  net.berlin:
      driver: bridge
      ipam:
        config:
          - subnet: 172.32.0.0/16
